server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    location = /nginx.conf { deny all; }

    location = / {
        return 302 /app/;
    }
    location = /app {
        return 302 /app/;
    }
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-store";
    }

    location = /updates.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        try_files /updates.json =404;
    }

    # Catalogue légal : APIs publiques Pluto TV (FAST, pubs incluses).
    location = /api/catalog/pluto/channels {
        proxy_ssl_server_name on;
        proxy_ssl_name api.pluto.tv;
        proxy_set_header Host api.pluto.tv;
        proxy_set_header User-Agent "HuberaStream/0.1 (legal catalog; +https://stream.hubera.cloud)";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=120";
        proxy_pass https://api.pluto.tv/v2/channels.json;
    }
    location = /api/catalog/pluto/boot {
        proxy_ssl_server_name on;
        proxy_ssl_name boot.pluto.tv;
        proxy_set_header Host boot.pluto.tv;
        proxy_set_header User-Agent "HuberaStream/0.1 (legal catalog; +https://stream.hubera.cloud)";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store";
        proxy_pass https://boot.pluto.tv/v4/start$is_args$args;
    }

    # Catalogue légal : API publique Arte.tv (EMAC v4 + player officiel).
    location = /api/catalog/arte/home {
        proxy_ssl_server_name on;
        proxy_ssl_name api-cdn.arte.tv;
        proxy_set_header Host api-cdn.arte.tv;
        proxy_set_header User-Agent "HuberaStream/0.1 (legal catalog; +https://stream.hubera.cloud)";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=180";
        proxy_pass https://api-cdn.arte.tv/api/emac/v4/fr/web/pages/HOME/?authorizedCountry=FR;
    }
    location ~ ^/api/catalog/arte/player/([A-Za-z0-9_-]+)$ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.arte.tv;
        proxy_set_header Host api.arte.tv;
        proxy_set_header User-Agent "HuberaStream/0.1 (legal catalog; +https://stream.hubera.cloud)";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=60";
        proxy_pass https://api.arte.tv/api/player/v2/config/fr/$1;
    }

    # Ancienne URL admin torrent : landing légale (pas un client).
    location ^~ /admin/torrents {
        try_files /admin/torrents/index.html /index.html;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
