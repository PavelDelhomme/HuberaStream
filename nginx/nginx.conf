user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Limites pour les uploads vidéo
    client_max_body_size 10G;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Proxy vers le backend
    upstream backend {
        server backend:8080;
    }

    # Proxy vers le frontend Next.js (nouveau système)
    upstream frontend {
        server frontend-nextjs:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Proxy vers l'ancien frontend React (legacy, désactivé par défaut)
    # Note: Ce service n'est disponible qu'avec le profile legacy
    # upstream frontend-legacy {
    #     server frontend:3000;
    # }

    server {
        listen 80;
        server_name localhost 192.168.1.134 _;

        # Servir les fichiers vidéo statiques
        location /videos/ {
            alias /usr/share/nginx/html/videos/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';
            
            # Support pour la lecture progressive
            add_header Accept-Ranges bytes;
            
            # Cache pour les vidéos
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API Backend - Configuration simplifiée
        # IMPORTANT: /api/ doit être AVANT /thumbnails/ pour que /api/thumbnails/ fonctionne
        # NOTE: Les headers CORS sont gérés par le backend (middleware CORS)
        # Ne pas ajouter de headers CORS ici pour éviter la duplication
        location /api/ {
            # Proxy vers le backend (le backend gère CORS)
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # IMPORTANT: Préserver le body de la requête pour les requêtes POST
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_buffering off;  # Désactiver le buffering pour éviter les problèmes avec les requêtes POST
            
            # Timeouts pour les uploads longs et extraction métadonnées
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # WebSocket pour Next.js HMR (développement)
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        
        # WebSocket pour Vite HMR (legacy, désactivé - ancien frontend non utilisé)
        # location /@vite/client {
        #     proxy_pass http://frontend-legacy;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_read_timeout 86400;
        # }

        # Servir les thumbnails statiques (fallback si pas dans /api/thumbnails/)
        # IMPORTANT: Cette route doit être APRÈS /api/ pour ne pas intercepter /api/thumbnails/
        location /thumbnails/ {
            alias /usr/share/nginx/html/thumbnails/;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Frontend Next.js (nouveau système)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Headers spécifiques Next.js
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Gestion des erreurs de connexion
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Retry en cas d'erreur
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }
        
        # Page d'erreur personnalisée pour 502/503/504
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Support HLS
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin *;
            add_header Content-Type application/vnd.apple.mpegurl;
            proxy_pass http://backend;
        }

        # Support DASH
        location ~ \.mpd$ {
            add_header Access-Control-Allow-Origin *;
            add_header Content-Type application/dash+xml;
            proxy_pass http://backend;
        }
    }
}
