user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Limites pour les uploads vidéo
    client_max_body_size 10G;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Proxy vers le backend
    upstream backend {
        server backend:8080;
    }

    # Proxy vers le frontend
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Servir les fichiers vidéo statiques
        location /videos/ {
            alias /usr/share/nginx/html/videos/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';
            
            # Support pour la lecture progressive
            add_header Accept-Ranges bytes;
            
            # Cache pour les vidéos
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Servir les thumbnails
        location /thumbnails/ {
            alias /usr/share/nginx/html/thumbnails/;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
            add_header Cache-Control "public";
        }

        # API Backend - Configuration simplifiée
        location /api/ {
            # Gérer OPTIONS (preflight CORS) - DOIT être avant proxy_pass
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, Accept, Origin, X-Requested-With, Access-Control-Request-Method, Access-Control-Request-Headers' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Length' '0' always;
                return 204;
            }

            # Proxy vers le backend pour toutes les autres méthodes
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # IMPORTANT: Préserver le body de la requête pour les requêtes POST
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_buffering off;  # Désactiver le buffering pour éviter les problèmes avec les requêtes POST
            
            # Headers CORS pour les réponses (après proxy)
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Type, Authorization' always;
            
            # Timeouts pour les uploads longs
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # WebSocket pour Vite HMR
        location /@vite/client {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Frontend React
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Support HLS
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin *;
            add_header Content-Type application/vnd.apple.mpegurl;
            proxy_pass http://backend;
        }

        # Support DASH
        location ~ \.mpd$ {
            add_header Access-Control-Allow-Origin *;
            add_header Content-Type application/dash+xml;
            proxy_pass http://backend;
        }
    }
}
