# Overlay Portainer — Nginx Proxy Manager (réseau VPS `shared-network-copy`).
# Usage : docker compose -f docker-compose.yml -f docker-compose.portainer.yml up -d
# Ne pas down -v. Ne pas renommer les volumes existants.

services:
  nginx:
    networks:
      - streammake-network
      - proxy

networks:
  proxy:
    external: true
    name: shared-network-copy
