services:
  postgres:
    image: postgres:15-alpine
    container_name: streammake-postgres
    labels:
      - "com.streammake.project=streammake"
    environment:
      POSTGRES_USER: streammake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streammake_password}
      POSTGRES_DB: streammake_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3302:5432"
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streammake -d streammake_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streammake-redis
    labels:
      - "com.streammake.project=streammake"
    ports:
      - "3303:6379"
    volumes:
      - redis_data:/data
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: streammake-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streammake-backend
    labels:
      - "com.streammake.project=streammake"
    command: sh -c "if [ -f /app/main ] && [ -x /app/main ]; then echo 'Exécution de /app/main (image Docker)'; exec /app/main; elif [ -f /app/bin/main ] && [ -x /app/bin/main ]; then echo 'Exécution de /app/bin/main (binaire local)'; exec /app/bin/main; else echo 'Aucun binaire exécutable trouvé'; exit 1; fi"
    # Accès au lecteur DVD/CD (USB et interne)
    # Utiliser privileged pour accéder à tous les devices block
    privileged: true # Nécessaire pour accéder aux devices
    # Permettre l'accès à tous les devices block (pour les lecteurs optiques)
    device_cgroup_rules:
      - 'c 11:* rmw' # Permettre l'accès aux devices block (major 11 = sr*)
    # Monter les devices spécifiques s'ils existent (optionnel, privileged devrait suffire)
    devices:
      - /dev/sr0:/dev/sr0:rw
      - /dev/cdrom:/dev/cdrom:rw
    volumes:
      - video_storage:/app/storage/videos
      - thumbnail_storage:/app/storage/thumbnails
      # Monter les points de montage DVD si disponibles (Linux)
      - /mnt/cdrom:/mnt/cdrom:ro
      - /media/cdrom:/media/cdrom:ro
      - /run/media:/run/media:ro
      - /media:/media:ro
      # Monter explicitement le point de montage du DVD si disponible
      - /run/media/pactivisme/KILL:/run/media/pactivisme/KILL:ro
      # Points de montage macOS (si applicable)
      - /Volumes:/Volumes:ro
      # MODE DÉVELOPPEMENT: Monter le binaire compilé localement (si disponible)
      - ./.backend-bin:/app/bin:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: streammake
      DB_PASSWORD: ${DB_PASSWORD:-streammake_password}
      DB_NAME: streammake_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      VIDEO_STORAGE_PATH: /app/storage/videos
      THUMBNAIL_STORAGE_PATH: /app/storage/thumbnails
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dev@delhomme.ovh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminStreamMake2024!}
      PORT: 8080
    ports:
      - "3301:8080"
      - "2345:2345" # Port pour Delve debugger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streammake-network
    restart: unless-stopped

  # Frontend Next.js (nouveau système - actif par défaut)
  frontend-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.dev
    container_name: streammake-frontend-nextjs
    labels:
      - "com.streammake.project=streammake"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3300/api"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - streammake-network
    restart: unless-stopped
    command: ["sh", "-c", "if [ ! -f node_modules/.bin/next ]; then echo 'npm ci (volume node_modules vide)…' && npm ci --legacy-peer-deps; fi && exec npm run dev"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Frontend React (ancien système - désactivé par défaut, profile legacy)
  frontend:
    image: streammake-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streammake-frontend
    labels:
      - "com.streammake.project=streammake"
    environment:
      REACT_APP_API_URL: "http://localhost:3300/api"
      VITE_API_URL: "http://localhost:3300/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3304:3000" # Port direct pour le frontend (dev)
    depends_on:
      - backend
    networks:
      - streammake-network
    restart: unless-stopped
    profiles:
      - legacy # Service optionnel, activé avec: docker-compose --profile legacy up

  nginx:
    image: nginx:alpine
    container_name: streammake-nginx
    labels:
      - "com.streammake.project=streammake"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - video_storage:/usr/share/nginx/html/videos:ro
      - thumbnail_storage:/usr/share/nginx/html/thumbnails:ro
    ports:
      - "3300:80" # Port principal via nginx
    depends_on:
      backend:
        condition: service_started
      frontend-nextjs:
        condition: service_healthy
    networks:
      - streammake-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  video_storage:
  thumbnail_storage:


networks:
  streammake-network:
    driver: bridge
