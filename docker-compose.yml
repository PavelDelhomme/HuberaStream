services:
  postgres:
    image: postgres:15-alpine
    container_name: streammake-postgres
    labels:
      - "com.streammake.project=streammake"
    environment:
      POSTGRES_USER: streammake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streammake_password}
      POSTGRES_DB: streammake_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3302:5432"
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streammake -d streammake_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streammake-redis
    labels:
      - "com.streammake.project=streammake"
    ports:
      - "3303:6379"
    volumes:
      - redis_data:/data
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: streammake-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streammake-backend
    labels:
      - "com.streammake.project=streammake"
    command: sh -c "if [ -f /app/main ] && [ -x /app/main ]; then echo 'Exécution de /app/main (image Docker)'; exec /app/main; elif [ -f /app/bin/main ] && [ -x /app/bin/main ]; then echo 'Exécution de /app/bin/main (binaire local)'; exec /app/bin/main; else echo 'Aucun binaire exécutable trouvé'; exit 1; fi"
    # Accès au lecteur DVD/CD (USB et interne)
    # Utiliser privileged pour accéder à tous les devices block
    privileged: true # Nécessaire pour accéder aux devices
    # Permettre l'accès à tous les devices block (pour les lecteurs optiques)
    device_cgroup_rules:
      - 'c 11:* rmw' # Permettre l'accès aux devices block (major 11 = sr*)
    # Monter les devices spécifiques s'ils existent (optionnel, privileged devrait suffire)
    devices:
      - /dev/sr0:/dev/sr0:rw
      - /dev/cdrom:/dev/cdrom:rw
    volumes:
      - video_storage:/app/storage/videos
      - thumbnail_storage:/app/storage/thumbnails
      # Monter les points de montage DVD si disponibles (Linux)
      - /mnt/cdrom:/mnt/cdrom:ro
      - /media/cdrom:/media/cdrom:ro
      - /run/media:/run/media:ro
      - /media:/media:ro
      # Monter explicitement le point de montage du DVD si disponible
      - /run/media/pactivisme/KILL:/run/media/pactivisme/KILL:ro
      # Points de montage macOS (si applicable)
      - /Volumes:/Volumes:ro
      # Partager le volume de config qBittorrent pour configuration automatique
      - qbittorrent_config:/config/qbittorrent:ro
      # MODE DÉVELOPPEMENT: Monter le binaire compilé localement (si disponible)
      - ./.backend-bin:/app/bin:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: streammake
      DB_PASSWORD: ${DB_PASSWORD:-streammake_password}
      DB_NAME: streammake_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      VIDEO_STORAGE_PATH: /app/storage/videos
      THUMBNAIL_STORAGE_PATH: /app/storage/thumbnails
      TORRENT_STORAGE_PATH: /app/storage/torrents
      TORRENT_DOWNLOAD_PATH: /downloads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dev@delhomme.ovh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminStreamMake2024!}
      PORT: 8080
      # Configuration des clients torrent (ports internes Docker)
      TRANSMISSION_URL: http://transmission:9091/transmission/rpc
      TRANSMISSION_USER: ${TRANSMISSION_USER:-transmission}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:-transmission}
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USER: ${QBITTORRENT_USER:-admin}
      QBITTORRENT_PASS: ${QBITTORRENT_PASS:-adminadmin}
      DELUGE_URL: http://deluge:8112/json
      DELUGE_PASS: ${DELUGE_PASS:-deluge}
      RTORRENT_URL: http://rtorrent:5000/RPC2
      TORRENT_CLIENT_TYPE: ${TORRENT_CLIENT_TYPE:-transmission}
      TORRENT_CLIENT_PATH: ${TORRENT_CLIENT_PATH:-http://transmission:9091/transmission/rpc}
      # Prowlarr / Radarr / Sonarr : renseigner dans .env si profile « arr » (voir docs/DEPLOY-PORTAINER.md)
      PROWLARR_URL: ${PROWLARR_URL:-}
      RADARR_URL: ${RADARR_URL:-}
      SONARR_URL: ${SONARR_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
    ports:
      - "3301:8080"
      - "2345:2345" # Port pour Delve debugger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streammake-network
    restart: unless-stopped

  # Frontend Next.js (nouveau système - actif par défaut)
  frontend-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.dev
    container_name: streammake-frontend-nextjs
    labels:
      - "com.streammake.project=streammake"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3300/api"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - streammake-network
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend React (ancien système - désactivé par défaut, profile legacy)
  frontend:
    image: streammake-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streammake-frontend
    labels:
      - "com.streammake.project=streammake"
    environment:
      REACT_APP_API_URL: "http://localhost:3300/api"
      VITE_API_URL: "http://localhost:3300/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3304:3000" # Port direct pour le frontend (dev)
    depends_on:
      - backend
    networks:
      - streammake-network
    restart: unless-stopped
    profiles:
      - legacy # Service optionnel, activé avec: docker-compose --profile legacy up

  nginx:
    image: nginx:alpine
    container_name: streammake-nginx
    labels:
      - "com.streammake.project=streammake"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - video_storage:/usr/share/nginx/html/videos:ro
      - thumbnail_storage:/usr/share/nginx/html/thumbnails:ro
    ports:
      - "3300:80" # Port principal via nginx
    depends_on:
      - backend
      - frontend-nextjs
    networks:
      - streammake-network
    restart: unless-stopped

  # Clients Torrent - Ports exposés sur 33XX
  transmission:
    image: linuxserver/transmission:latest
    container_name: streammake-transmission
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      # TRANSMISSION_WEB_HOME retiré car l'image ne supporte plus les UI tiers
      - USER=transmission
      - PASS=transmission
    volumes:
      - torrent_storage:/downloads
      - torrent_config:/config
      - torrent_watch:/watch # Dossier pour surveiller les nouveaux torrents
    ports:
      - "3305:9091" # Transmission Web UI
    networks:
      - streammake-network
    restart: unless-stopped
    # Créer les dossiers nécessaires au démarrage
    entrypoint: >
      /bin/sh -c " mkdir -p /downloads/complete /downloads/incomplete /watch 2>/dev/null || true && /init "

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: streammake-qbittorrent
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
      # Variables pour la configuration automatique
      - QBITTORRENT_URL=http://localhost:3306
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-adminadmin}
    volumes:
      - torrent_storage:/downloads
      - qbittorrent_config:/config
    ports:
      - "3306:8080" # qBittorrent Web UI
    networks:
      - streammake-network
    restart: unless-stopped
    depends_on:
      - backend
    # Le mot de passe sera configuré automatiquement par le backend au démarrage

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: streammake-deluge
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DELUGE_LOGLEVEL=error
    volumes:
      - torrent_storage:/downloads
      - deluge_config:/config
    ports:
      - "3307:8112" # Deluge Web UI
      - "3309:58846" # Deluge Daemon
    networks:
      - streammake-network
    restart: unless-stopped

  rtorrent:
    # Image mise à jour : l'ancienne image linuxserver/rutorrent est dépréciée
    image: crazymax/rtorrent-rutorrent:latest
    container_name: streammake-rtorrent
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - RTORRENT_DHT_PORT=6881
      - RTORRENT_INC_PORT=50000
      - RTORRENT_MAX_PEERS=200
      - RTORRENT_MAX_PEERS_GLOBAL=200
    volumes:
      - torrent_storage:/data
      - rtorrent_config:/home/rtorrent/.rtorrent
    ports:
      - "3308:80" # ruTorrent Web UI
      - "3310:5000" # rTorrent XMLRPC
      - "3311:6881" # rTorrent DHT port
      - "3311:6881/udp"
      - "3312:51413" # rTorrent Peer port (TCP)
      - "3312:51413/udp" # rTorrent Peer port (UDP)
    networks:
      - streammake-network
    restart: unless-stopped

  # Suite *arr : indexer + films + séries (optionnel — docker compose --profile arr up -d)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: streammake-prowlarr
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - prowlarr_config:/config
      - torrent_storage:/downloads
    ports:
      - "3326:9696"
    networks:
      - streammake-network
    restart: unless-stopped
    profiles:
      - arr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: streammake-radarr
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - radarr_config:/config
      - torrent_storage:/downloads
    ports:
      - "3327:7878"
    networks:
      - streammake-network
    restart: unless-stopped
    profiles:
      - arr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: streammake-sonarr
    labels:
      - "com.streammake.project=streammake"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - sonarr_config:/config
      - torrent_storage:/downloads
    ports:
      - "3328:8989"
    networks:
      - streammake-network
    restart: unless-stopped
    profiles:
      - arr

volumes:
  postgres_data:
  redis_data:
  video_storage:
  thumbnail_storage:
  torrent_storage:
  torrent_config:
  torrent_watch: # Volume pour le dossier watch de Transmission
  qbittorrent_config:
  deluge_config:
  rtorrent_config:
  prowlarr_config:
  radarr_config:
  sonarr_config:


networks:
  streammake-network:
    driver: bridge
