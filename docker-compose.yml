services:
  postgres:
    image: postgres:15-alpine
    container_name: streammake-postgres
    environment:
      POSTGRES_USER: streammake
      POSTGRES_PASSWORD: streammake_password
      POSTGRES_DB: streammake_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3302:5432"
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streammake -d streammake_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streammake-redis
    ports:
      - "3303:6379"
    volumes:
      - redis_data:/data
    networks:
      - streammake-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streammake-backend
    # Accès au lecteur DVD/CD
    devices:
      - /dev/dvd:/dev/dvd:rw
      - /dev/cdrom:/dev/cdrom:rw
      - /dev/sr0:/dev/sr0:rw
      - /dev/sr1:/dev/sr1:rw
      - /dev/sr2:/dev/sr2:rw
    privileged: true # Nécessaire pour accéder aux devices
    volumes:
      - video_storage:/app/storage/videos
      - thumbnail_storage:/app/storage/thumbnails
      # Monter les points de montage DVD si disponibles
      - /mnt/cdrom:/mnt/cdrom:ro
      - /media/cdrom:/media/cdrom:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: streammake
      DB_PASSWORD: streammake_password
      DB_NAME: streammake_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      VIDEO_STORAGE_PATH: /app/storage/videos
      THUMBNAIL_STORAGE_PATH: /app/storage/thumbnails
      TORRENT_STORAGE_PATH: /app/storage/torrents
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dev@delhomme.ovh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminStreamMake2024!}
      PORT: 8080
      # Configuration des clients torrent (ports internes Docker)
      TRANSMISSION_URL: http://transmission:9091/transmission/rpc
      TRANSMISSION_USER: ${TRANSMISSION_USER:-transmission}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:-transmission}
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USER: ${QBITTORRENT_USER:-admin}
      QBITTORRENT_PASS: ${QBITTORRENT_PASS:-adminadmin}
      DELUGE_URL: http://deluge:8112/json
      DELUGE_PASS: ${DELUGE_PASS:-deluge}
      RTORRENT_URL: http://rtorrent:5000/RPC2
      TORRENT_CLIENT_TYPE: ${TORRENT_CLIENT_TYPE:-transmission}
      TORRENT_CLIENT_PATH: ${TORRENT_CLIENT_PATH:-http://transmission:9091/transmission/rpc}
    ports:
      - "3301:8080"
      - "2345:2345" # Port pour Delve debugger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streammake-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streammake-frontend
    environment:
      # Utiliser Nginx comme reverse proxy (port 3300)
      # Le problème 403 Forbidden a été résolu en configurant SetTrustedProxies dans Gin
      REACT_APP_API_URL: "http://localhost:3300/api"
      VITE_API_URL: "http://localhost:3300/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3304:3000" # Port direct pour le frontend (dev)
    depends_on:
      - backend
    networks:
      - streammake-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: streammake-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - video_storage:/usr/share/nginx/html/videos:ro
      - thumbnail_storage:/usr/share/nginx/html/thumbnails:ro
    ports:
      - "3300:80" # Port principal via nginx
    depends_on:
      - backend
      - frontend
    networks:
      - streammake-network
    restart: unless-stopped

  # Clients Torrent - Ports exposés sur 33XX
  transmission:
    image: linuxserver/transmission:latest
    container_name: streammake-transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - TRANSMISSION_WEB_HOME=/transmission-web-control/
      - USER=transmission
      - PASS=transmission
    volumes:
      - torrent_storage:/downloads
      - torrent_config:/config
    ports:
      - "3305:9091" # Transmission Web UI
    networks:
      - streammake-network
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: streammake-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - torrent_storage:/downloads
      - qbittorrent_config:/config
    ports:
      - "3306:8080" # qBittorrent Web UI
    networks:
      - streammake-network
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: streammake-deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DELUGE_LOGLEVEL=error
    volumes:
      - torrent_storage:/downloads
      - deluge_config:/config
    ports:
      - "3307:8112" # Deluge Web UI
      - "3309:58846" # Deluge Daemon
    networks:
      - streammake-network
    restart: unless-stopped

  rtorrent:
    image: linuxserver/rutorrent:latest
    container_name: streammake-rtorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - torrent_storage:/downloads
      - rtorrent_config:/config
    ports:
      - "3308:80" # ruTorrent Web UI
      - "3310:5000" # rTorrent XMLRPC
      - "3311:6881" # rTorrent DHT port
      - "3311:6881/udp"
    networks:
      - streammake-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  video_storage:
  thumbnail_storage:
  torrent_storage:
  torrent_config:
  qbittorrent_config:
  deluge_config:
  rtorrent_config:


networks:
  streammake-network:
    driver: bridge
